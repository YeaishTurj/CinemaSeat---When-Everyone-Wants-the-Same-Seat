name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Poridhi VM
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Update application over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PORIDHI_HOST }}
          username: ${{ secrets.PORIDHI_USER }}
          key: ${{ secrets.PORIDHI_SSH_KEY }}
          script: |
            set -e
            cd ~/cinemaseat
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            docker compose up -d --build --remove-orphans
            docker compose exec -T api node -e "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
