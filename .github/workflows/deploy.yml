name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker compose -f docker-compose.yml build

      # Wire to Poridhi VM via SSH runner or a self-hosted runner on the VM.
      # Concrete deploy steps depend on the Poridhi load-balancer target chosen
      # at deployment time — placeholder below.
      - name: Deploy to Poridhi VM
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "Deploy step is environment-specific; configure self-hosted runner or SSH."
